# Shopify app configuration for OpenTrust.
# The client_id is public (it is not the secret). `shopify app config link` can refresh these values from the Partner Dashboard.
client_id = "a1edad1d76a1314324b31cf55c0d71a5"
name = "OpenTrust"
application_url = "https://stores.opentrust.in"
embedded = true

[build]
# `shopify app dev` points the app at a temporary tunnel to your laptop. Deploying (`shopify app deploy`) sets the URLs above again.
automatically_update_urls_on_dev = true

[auth]
redirect_urls = ["https://stores.opentrust.in/auth/callback"]

[access_scopes]
# read_orders: receive new orders. write_orders: tag an order and add a note to it.
scopes = "read_orders,write_orders"

[webhooks]
api_version = "2026-10"

  # Handled by: app/routes/webhooks.orders.create.tsx
  # Reading an order's phone number needs "protected customer data" access (see README).
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = ["orders/create"]

  # Handled by: app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Mandatory privacy webhooks for public apps.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

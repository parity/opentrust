# Throwaway WordPress + WooCommerce for trying the plugin against an OpenTrust app running on your machine.
# See README.md in this folder. Nothing here is used in production.
name: otwp
x-wp-mounts: &mounts
  - wp:/var/www/html
  - ../opentrust-for-woocommerce:/var/www/html/wp-content/plugins/opentrust-for-woocommerce:ro
  - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  - ./scripts:/scripts:ro
services:
  db:
    image: mariadb:10.11
    environment: { MARIADB_DATABASE: wp, MARIADB_USER: wp, MARIADB_PASSWORD: wp, MARIADB_ROOT_PASSWORD: root }
  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["8088:80"]
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp }
    volumes: *mounts
  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on: [wordpress]
    profiles: [tools]
    working_dir: /var/www/html
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp }
    volumes: *mounts
volumes: { wp: {} }
